name: Build V2 Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: v2-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out V2
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Give APK a clear phone filename
        run: cp app/build/outputs/apk/debug/app-debug.apk RAMSIERS-GRANITE-V2-TEST.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: RAMSIERS-GRANITE-V2-TEST-APK
          path: RAMSIERS-GRANITE-V2-TEST.apk
          if-no-files-found: error
          retention-days: 30
